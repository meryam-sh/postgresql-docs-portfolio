name: Documentation checks

on:
  push:
  pull_request:

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required documentation files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            README.md \
            CONTRIBUTING.md \
            docs/postgresql-fundamentals.md \
            docs/roles-and-permissions.md \
            docs/storage-and-retrieval.md \
            docs/linux-postgresql-troubleshooting.md \
            docs/docs-as-code-workflow.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
            grep -q '^# ' "$file" || { echo "Missing H1 heading: $file"; exit 1; }
          done
          test -s examples/customer-queries.sql
          echo "Required documentation files are present and nonempty."
